name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline, HTTP mocked with respx)
        run: python -m pytest

      - name: Smoke-test CLI and schema on SQLite
        run: |
          python cli.py init-db
          python cli.py init-db
