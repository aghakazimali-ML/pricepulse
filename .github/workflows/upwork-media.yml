name: upwork-media
on:
  push:
    branches: [upwork-media]
    paths: [media-capture/record.py, .github/workflows/upwork-media.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: mkdir -p media-capture/out && python media-capture/record.py media-capture/out
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-capture/out
          git commit -m "Record Upwork media from the live site"
          git push
